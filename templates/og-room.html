<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000;color:#f4f1e8;font-family:'IBM Plex Sans',sans-serif;position:relative}
.bg{position:absolute;inset:-40px;background:url(art.svg) right center/cover no-repeat;filter:blur(26px) brightness(.38) saturate(1.1)}
.tint{position:absolute;inset:0;background:radial-gradient(60% 90% at 78% 50%,color-mix(in srgb,{{accent}} 26%,transparent),transparent 70%),linear-gradient(90deg,rgba(0,0,0,.92) 0,rgba(0,0,0,.72) 48%,rgba(0,0,0,.25) 100%)}
.l{position:absolute;left:72px;top:64px;width:600px}
.bm{display:flex;align-items:center;gap:12px;font:700 34px/1 'Space Grotesk';letter-spacing:-.02em;color:#fff}.bm svg{width:26px;height:35px;color:#F5B800}.bm i{font-style:normal;color:{{accent}}}
.k{margin-top:44px;font:500 16px/1.3 'IBM Plex Mono';letter-spacing:.18em;color:{{accent}}}
h1{font:700 60px/1.02 'Space Grotesk';letter-spacing:-.035em;margin:16px 0 20px;color:#fff}
h1 em{font-style:normal;color:{{accent}}}
p{font-size:23px;color:#d2cdc0;margin:0;line-height:1.4;max-width:560px}
.pill{display:inline-block;margin-top:28px;padding:15px 28px;border-radius:99px;background:linear-gradient(180deg,#ffe58a,#ffd24d 55%,#e0a800);color:#000;font:700 19px/1 'Space Grotesk'}
.u{position:absolute;left:72px;bottom:44px;font:500 17px 'IBM Plex Mono';color:#a29e93}
.fr{position:absolute;right:64px;top:62px;width:420px;height:506px;border-radius:22px;overflow:hidden;border:1.5px solid rgba(255,210,77,.55);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 70px color-mix(in srgb,{{accent}} 30%,transparent)}
.fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center}
.fr::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 40%)}
.chip{position:absolute;left:20px;bottom:20px;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:99px;background:rgba(0,0,0,.6);border:1px solid color-mix(in srgb,{{accent}} 60%,transparent);font:600 16px/1 'Space Grotesk';letter-spacing:.14em;color:#fff}
.chip b{width:34px;height:34px;border-radius:50%;background:{{accent}};display:grid;place-items:center}
.chip svg{width:20px;height:20px}
</style></head><body>
<div class="bg"></div><div class="tint"></div>
<div class="l"><div class="bm"><svg viewBox="23 8 74 100"><path fill="currentColor" d="M45 12V72H27V30Z M27 72a33 33 0 1 1 66 0a33 33 0 1 1-66 0Z M45 72a15 15 0 1 0 30 0a15 15 0 1 0-30 0Z"/></svg><span>{{base}}<i>X</i></span></div>
<div class="k">{{eyebrow}}</div>
<h1>{{headline}}</h1>
<p>{{line}}</p>
<span class="pill">{{action}}</span></div>
<div class="fr"><img src="art.svg" alt=""><span class="chip"><b><svg viewBox="0 0 24 24"><g fill="none" stroke="#1d1a16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 1.6 2.7-.1.9 2.6 2.2 1.6-.8 2.6.8 2.6-2.2 1.6-.9 2.6-2.7-.1L12 21l-2.2-1.6-2.7.1-.9-2.6-2.2-1.6.8-2.6-.8-2.6 2.2-1.6.9-2.6 2.7.1z M8.8 12l2.2 2.2 4.2-4.4"/></g></svg></b>{{seal}}</span></div>
<div class="u">{{domain}}{{urlPath}}</div>
</body></html>
