<svg viewBox="0 0 1600 440" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- Original composition (bCorp): an invented ground-floor plan, drawn in hairlines, with raking light. -->
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14100d"/><stop offset=".6" stop-color="#0a0807"/><stop offset="1" stop-color="#050404"/></linearGradient>
    <linearGradient id="pp-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2c59b" stop-opacity="0"/><stop offset=".5" stop-color="#f2c59b" stop-opacity=".09"/><stop offset="1" stop-color="#f2c59b" stop-opacity="0"/></linearGradient>
    <pattern id="pp-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f4f1e8" stroke-opacity=".045" stroke-width="1"/></pattern>
    <pattern id="pp-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#D4806A" stroke-opacity=".35" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="440" fill="url(#pp-bg)"/>
  <rect width="1600" height="440" fill="url(#pp-grid)"/>
  <g transform="rotate(-6 800 220)">
    <!-- walls -->
    <g fill="none" stroke="#efe9df" stroke-opacity=".55" stroke-width="6" stroke-linejoin="miter">
      <path d="M260 60H1180V300H900M820 300H260V60"/>
      <path d="M600 60V180M600 230V300M900 60V140M900 190V300"/>
    </g>
    <!-- glazing -->
    <g stroke="#efe9df" stroke-opacity=".5" stroke-width="1.5"><path d="M300 300H560M300 304H560M960 300H1140M960 304H1140"/></g>
    <!-- door swings -->
    <g fill="none" stroke="#efe9df" stroke-opacity=".3" stroke-width="1"><path d="M600 180a50 50 0 0 1 50 50M600 180h50"/><path d="M900 140a50 50 0 0 0-50 50M900 140h-50"/><path d="M820 300a80 80 0 0 0 80-80V300"/></g>
    <!-- pool, hatched, in accent -->
    <rect x="300" y="340" width="880" height="70" fill="url(#pp-hatch)" stroke="#D4806A" stroke-opacity=".7" stroke-width="1.5"/>
    <!-- one room outlined in accent: the room under discussion -->
    <rect x="606" y="66" width="288" height="228" fill="#D4806A" fill-opacity=".06" stroke="#D4806A" stroke-width="1.5" stroke-dasharray="6 5"/>
    <!-- stair -->
    <g stroke="#efe9df" stroke-opacity=".3" stroke-width="1"><path d="M1060 80v160M1080 80v160M1100 80v160M1120 80v160M1140 80v160M1040 80h120v160h-120z" fill="none"/></g>
    <!-- dimension lines -->
    <g stroke="#efe9df" stroke-opacity=".28" stroke-width="1" fill="none"><path d="M260 30H1180M260 22v16M600 22v16M900 22v16M1180 22v16M1220 60V300M1212 60h16M1212 300h16"/></g>
    <!-- column grid -->
    <g fill="none" stroke="#efe9df" stroke-opacity=".22" stroke-width="1"><circle cx="260" cy="-10" r="12"/><circle cx="600" cy="-10" r="12"/><circle cx="900" cy="-10" r="12"/><circle cx="1180" cy="-10" r="12"/></g>
  </g>
  <rect width="1600" height="440" fill="url(#pp-light)" transform="skewX(-24)"/>
</svg>
