<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} · {{tagline}}</title>
<meta name="description" content="{{purpose}}">
<link rel="canonical" href="https://{{domain}}/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://{{domain}}/">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="{{name}} · {{tagline}}">
<meta property="og:description" content="{{purpose}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{name}} · {{tagline}}">
<meta name="twitter:description" content="{{purpose}}">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#f4f1e8;--mute:#9a968b;--line:rgba(255,210,77,.16);--accent:{{accent}};--gold:#ffd24d;--card:#0b0b0c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'IBM Plex Sans',system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 22px 'Space Grotesk'}
.gold{color:var(--gold)}
.nav-links{display:flex;gap:18px;align-items:center;font-size:14px}
.nav-links a{text-decoration:none;color:#cfcabd}
@media(max-width:640px){.hide-s{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;font:600 15px 'Space Grotesk';text-decoration:none;border:0;cursor:pointer}
.btn-ghost{border:1px solid var(--line);color:var(--ink)!important;background:transparent}
.btn-ghost:hover{border-color:var(--accent)}
.eyebrow,.kicker{font:600 13px 'Space Grotesk';letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h1{font:700 clamp(46px,8.5vw,112px)/.92 'Space Grotesk';letter-spacing:-.045em;margin:0 0 20px;overflow-wrap:anywhere}
h1 em{font-style:normal;color:transparent;-webkit-text-stroke:2px var(--accent)}
h2{font:700 clamp(30px,4.6vw,56px)/1.02 'Space Grotesk';letter-spacing:-.03em;margin:0 0 18px}
.lede{font-size:clamp(18px,2.1vw,22px);color:#d8d3c5;max-width:640px;margin:0 0 28px}
section{padding:88px 0;border-bottom:1px solid var(--line)}
.hero{padding:56px 0 80px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-220px;top:-200px;width:760px;height:760px;max-width:100vw;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%);pointer-events:none}
.hero .wrap{position:relative}
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.status{display:inline-block;margin-bottom:18px;font:600 11px 'Space Grotesk';letter-spacing:.12em;text-transform:uppercase;color:#000;background:var(--accent);border-radius:999px;padding:4px 12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:18px;margin-top:30px}
@media(max-width:820px){.three{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.card h3{font:700 22px 'Space Grotesk';margin:6px 0 10px}
.card p{color:#d8d3c5;margin:0}
.card b.n{font:700 44px 'Space Grotesk';color:var(--accent);display:block;line-height:1}
.tag{display:inline-block;font:600 11px 'Space Grotesk';letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
footer{padding:40px 0;color:var(--mute);font-size:13px}
</style>
</head>
<body>
{{strip}}
<header class="wrap nav">
  <a class="brand" href="/" aria-label="{{name}} home"><img src="/logo.svg" width="28" height="28" alt=""><span>{{base}}<span class="gold">X</span></span></a>
  <nav class="nav-links" aria-label="Main"><a class="hide-s" href="#how">How it works</a>{{navFlick}}<span data-bwx></span></nav>
</header>

<main>
<section class="hero">
  <div class="wrap">
    {{statusBadge}}
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{headline}}</h1>
    <p class="lede">{{lede}}</p>
    <div class="ctas"><span data-bwx></span><a class="btn btn-ghost" href="https://bwalletx.com/get">Get bWalletX</a>{{ctaFlick}}</div>
  </div>
</section>

<section id="how">
  <div class="wrap">
    <p class="kicker">How it works</p>
    <h2>{{howTitle}}</h2>
    <div class="three">{{how}}</div>
  </div>
</section>

<section>
  <div class="wrap">
    <p class="kicker">Why {{name}}</p>
    <h2>{{purpose}}</h2>
    <div class="four">{{why}}</div>
  </div>
</section>
</main>

<footer class="wrap">{{name}} · part of the bWalletX family · <a href="https://bmintx.com/flick-off">FLICK OFF</a> · <a href="https://bwalletx.com/get">Get bWalletX</a></footer>

<script src="https://unpkg.com/@bwalletx/connect@0.5.0/dist/bwalletx-connect.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="/bwx.js"></script>
</body>
</html>
