<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000;color:#f4f1e8;font-family:'IBM Plex Sans',sans-serif;position:relative;
background-image:radial-gradient(closest-side at 80% 50%,color-mix(in srgb,{{accent}} 24%,transparent),transparent),radial-gradient(40% 60% at 6% 100%,color-mix(in srgb,{{accent}} 9%,transparent),transparent 70%)}
.l{position:absolute;left:78px;top:70px;width:690px}
.bm{display:flex;align-items:center;gap:12px;font:700 34px/1 'Space Grotesk';letter-spacing:-.02em}.bm svg{width:26px;height:35px}.bm i{font-style:normal;color:#ffd24d}
.k{margin-top:46px;font:600 17px/1 'IBM Plex Mono';letter-spacing:.2em;color:{{accent}}}
h1{font:700 86px/.96 'Space Grotesk';letter-spacing:-.045em;margin:18px 0 22px;color:#fff}
h1 em{font-style:normal;color:{{accent}}}
p{font-size:24px;color:#bdbab0;margin:0;line-height:1.4;max-width:640px}
.pill{display:inline-block;margin-top:28px;padding:15px 28px;border-radius:99px;background:linear-gradient(180deg,#ffe58a,#ffd24d 55%,#e0a800);color:#000;font:700 19px/1 'Space Grotesk'}
.u{position:absolute;left:78px;bottom:48px;font:500 18px 'IBM Plex Mono';color:#8a877e}
.mk{position:absolute;right:120px;top:150px;width:250px;height:338px;filter:drop-shadow(0 30px 60px color-mix(in srgb,{{accent}} 45%,transparent))}
</style></head><body>
<div class="l"><div class="bm"><svg viewBox="23 8 74 100"><defs><mask id="a"><rect width="140" height="140" fill="#fff"/><circle cx="60" cy="72" r="15" fill="#000"/></mask></defs><g fill="{{accent}}" mask="url(#a)"><polygon points="45,12 45,76 27,76 27,30"/><circle cx="60" cy="72" r="33"/></g></svg><span>{{base}}<i>X</i></span></div>
<div class="k">{{eyebrow}}</div>
<h1>{{headline}}</h1>
<p>{{line}}</p>
<span class="pill">{{action}}</span></div>
<svg class="mk" viewBox="23 8 74 100"><defs><mask id="b"><rect width="140" height="140" fill="#fff"/><circle cx="60" cy="72" r="15" fill="#000"/></mask></defs><g fill="{{accent}}" mask="url(#b)"><polygon points="45,12 45,76 27,76 27,30"/><circle cx="60" cy="72" r="33"/></g></svg>
<div class="u">{{domain}}</div>
</body></html>
